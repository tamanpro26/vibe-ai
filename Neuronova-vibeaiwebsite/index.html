<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="VibeAI is a multi-provider, multi-agent AI orchestration system. An autonomous coding agent and multi-model reasoning pipeline built entirely on free-tier LLMs with automatic cross-provider failover."
    />
    <title>VibeAI / Multi-Provider Multi-Agent Orchestration Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The record's two hands. Public Sans is a records workhorse (the US Web
         Design System face, made for official documents) and Martian Mono is
         the ledger hand for entry numbers, timestamps, and attribution. Both
         sit off the exhausted axis every AI product converges on — Inter, IBM
         Plex, Space Grotesk/Mono, DM, Outfit, Jakarta — and mono here does its
         real job (numbers and measurement) rather than dressing the UI up as
         "technical". Chakra Petch and Instrument Serif are gone with the two
         themes they belonged to. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Martian+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Theme applied before first paint. This has to be a blocking inline
         script, not React state: the bundle loads and hydrates after the
         browser has already painted, so setting the theme there would show
         every Studio user a flash of the dark Cockpit palette on every page
         load. Kept tiny and dependency-free so it costs no meaningful time,
         and wrapped in try/catch because localStorage throws outright in
         some privacy modes -- a storage failure must fall back to the
         default theme, never abort the script and leave the page unthemed. -->
    <script>
      (function () {
        var d = document.documentElement
        try {
          var t = localStorage.getItem('vibeai_theme')
          d.dataset.theme = t === 'studio' ? 'studio' : 'cockpit'
          // Appearance prefs live under the per-user settings key, which we
          // cannot resolve this early (no user yet). Scanning for the first
          // settings bucket is a pragmatic trade: on a shared browser the
          // previous user's density could briefly apply, which is a cosmetic
          // nit, whereas flashing the wrong layout on every load is not.
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i)
            if (k && k.indexOf('vibeai_settings_') === 0) {
              var s = JSON.parse(localStorage.getItem(k) || '{}')
              if (s.density) d.dataset.density = s.density
              if (s.textSize) d.dataset.textSize = s.textSize
              if (s.motion) d.dataset.motion = s.motion
              if (s.chatFont) d.dataset.chatFont = s.chatFont
              break
            }
          }
        } catch (e) {
          d.dataset.theme = 'cockpit'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
