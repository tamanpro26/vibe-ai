; PlatformIO project for hardware/esp32-firmware/src/main.cpp -- the school
; heat-monitor firmware, Arduino/C++ (not the earlier hardware/controller.py,
; which was MicroPython and needs the MicroPython interpreter flashed first;
; this project runs directly on the standard Arduino-over-ESP-IDF core
; PlatformIO already targets, no separate interpreter flash needed).
;
; Open this FOLDER (hardware/esp32-firmware/) as its own PlatformIO project
; -- not the repo root -- so PlatformIO finds this platformio.ini.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    ; DHT11 is a digital single-wire-protocol sensor, not an analog
    ; LM35-style voltage output -- analogRead() on its data pin was reading
    ; raw electrical noise, which is exactly why it showed 330.0degC. This
    ; library actually decodes the DHT11's real protocol.
    ;
    ; Using beegee-tokyo's fork, not Adafruit's original: confirmed live that
    ; Adafruit's version panics with "Interrupt wdt timeout on CPU1" whenever
    ; the sensor fails to respond -- its busy-wait timeout math assumes 1
    ; CPU cycle per loop iteration (true on AVR, false on ESP32 where each
    ; iteration's digitalRead() costs far more), so the "1ms timeout" balloons
    ; into a real stall with interrupts disabled, long enough to trip the
    ; watchdog instead of returning a clean failure. This fork is a drop-in
    ; API-compatible replacement (same DHT class/methods) with ESP32-safe
    ; timing, so main.cpp needed no changes.
    beegee-tokyo/DHT sensor library for ESPx@^1.19
